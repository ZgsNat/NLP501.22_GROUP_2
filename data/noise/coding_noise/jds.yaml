# JD set. `gold_spec` = hidden annotation rubric for the SYNTHETIC gold labels only;
# `hr_answers` = what the (simulated) HR answers to clarification questions (H6).
# The FPT Software JD is a representative posting written for this course project.

- id: fpt_automation_test
  title: Automation Test Engineer – FPT Software
  company_type: outsourcing
  profile: Outsourcing
  split: test
  text: |
    Automation Test Engineer – FPT Software (Hà Nội / TP.HCM)
    FPT Software delivers offshore projects for clients in Japan, the US and Europe.
    We are looking for Automation Test Engineers to join our testing center.

    Job description
    - Write and maintain automated test scripts for web and mobile applications
    - Build and improve the automation framework, integrate test runs into the CI pipeline
    - Perform API testing and report defects in Jira

    Requirements
    - At least 2 years of experience in automation testing
    - Hands-on with Selenium WebDriver, Playwright or Appium
    - Programming skills in Java or Python
    - Able to read and write technical documents in English

    Nice to have
    - ISTQB Foundation certificate is a plus
    - Japanese (JLPT N3 or above) is an advantage
    - Experience with Jenkins or GitLab CI
    - API testing with Postman or Rest Assured; performance testing with JMeter
  gold_spec:
    must: {years: 2, depth: 2, tools_any: [selenium, playwright, appium]}
    nice: {tools: [postman, rest assured, jmeter], langs: [java, python], istqb: true, japanese: true}

